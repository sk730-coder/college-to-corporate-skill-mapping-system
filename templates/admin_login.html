{% extends "base.html" %}
{% block title %}Admin Login — College2Corporate{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="glass-panel p-5">
                <div class="text-center mb-4">
                    <div class="fs-1 text-warning mb-3">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h2 class="fw-bold text-white mb-2">Admin Access</h2>
                    <p class="text-secondary">Enter admin password to continue</p>
                </div>

                {% if error %}
                <div class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger rounded-3 mb-4">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="mb-4">
                        <label for="password" class="form-label text-white fw-bold">
                            <i class="bi bi-key me-2"></i>Admin Password
                        </label>
                        <input type="password" class="form-control bg-transparent border-secondary text-white" 
                               id="password" name="password" required 
                               placeholder="Enter admin password">
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg py-3 rounded-pill fw-bold">
                            <i class="bi bi-shield-check me-2"></i>Login to Admin
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('index') }}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
